# OTABase 5G RRC Fuzzing Configuration
#
# This configuration enables OTABase-style RRC fuzzing injection on the gNB CU-CP.
# It extends a standard gNB config with OTABase-specific RRC parameters.
#
# Usage:
#   sudo ./gnb -c gnb_rf_b200_tdd_n78_20mhz.yml -c otabase_fuzzing.yml
#
# The test payload file path and the index file (testFileIndex) must be prepared
# before starting the gNB.  See artifact/srsRAN_Project/configs/OTABASE_README.md
# for details.

cu_cp:
  rrc:
    # Enable OTABase 5G RRC fuzzing injection.
    otabase_enable_5g_rrc_fuzzing: true

    # Path to the index file.
    # IMPORTANT: relative paths are resolved relative to the gnb PROCESS working
    # directory (i.e. where you run the gnb binary from), NOT relative to this
    # YAML file's location.
    # If you get "OTABase: failed to open index file" errors, use an ABSOLUTE path:
    #   otabase_test_index_file: /absolute/path/to/example-test-case/rrc/testFileIndex
    # Relative payload filenames inside testFileIndex will be resolved relative
    # to the directory that CONTAINS testFileIndex (not the working directory).
    otabase_test_index_file: ../example-test-case/rrc/testFileIndex

    # Oracle liveness check period: send a UECapabilityEnquiry every N test
    # messages to verify the UE is still alive.  Default: 10.
    otabase_check_period: 10

    # Replay mode: when true, uses a shorter check_period (2) and disables
    # blacklisting.  Useful for replaying a specific sequence of messages to
    # confirm a crash.  Default: false.
    otabase_replay_mode: false

    # Pacing timer in milliseconds.  When > 0, works alongside RLC ACK:
    # whichever fires first (RLC ACK or timer) triggers the next message.
    # Set to 0 to rely solely on RLC ACK (same as 4G).  Default: 5.
    otabase_pacing_ms: 5

    # When true, skip injection at rrc_setup_complete (pre-auth); first injection
    # happens at security_mode_complete (post-auth).  Default: false.
    otabase_inject_after_auth_only: false
